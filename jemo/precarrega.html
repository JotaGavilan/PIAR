<!DOCTYPE html>
<html lang="ca-ES-valencia">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>JEmo – descàrrega del model del cos</title>
</head>
<body>
<!-- Pàgina oculta: la crida la portada («Descarregar per a ús sense Internet»). Carrega el model del cos (PoseNet), l'únic que no és
     dins de /vendor/, perquè el service worker el guarde i després funcione sense Internet. Els models de cara (xarxa neuronal i
     MediaPipe) ja són dins de /vendor/. No usa càmera. Mateixes opcions que l'app (js/vision.js). -->
<script src="../vendor/tfjs-4.15.0/tf.min.js"></script>
<script src="../vendor/posenet-2.2.2/posenet.min.js"></script>
<script>
(async () => {
  const steps = []; let ok = true, error = null;
  try { const m = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: .75 }); if (m.dispose) m.dispose(); steps.push({ name: 'cos (PoseNet)', ok: true }); }
  catch (e) { ok = false; error = String(e && e.message || e); steps.push({ name: 'cos (PoseNet)', ok: false, error }); }
  parent.postMessage({ piarPreload: 'jemo', finished: true, ok, steps, error }, location.origin);
})();
</script>
</body>
</html>
